<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .icon {
      transform-origin: center;
      animation: glow 2.4s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.85;
      }
    }
  </style>

  <g class="icon">
    <path fill="#EA4335" d="M10 25v50h14V42l26 20 26-20v33h14V25L50 45 10 25z"/>
    <path fill="#4285F4" d="M10 25l40 30 40-30-7-8-33 25-33-25-7 8z"/>
  </g>
</svg>
